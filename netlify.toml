[build]
  command = "npm run build"
  publish = "dist"
  functions = "api"
  environment = { SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_ANON_KEY,VITE_SUPABASE_ANON_KEY" }

[functions]
  node_bundler = "esbuild"

# Redirect /api/* to Netlify serverless functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# React Router SPA catch-all redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

